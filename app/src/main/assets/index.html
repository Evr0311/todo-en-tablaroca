<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">
<title>Todo En Tablaroca</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#0879d1;padding:18px;text-align:center;font-size:23px;font-weight:bold}
main{padding:12px}
.panel{background:#1d2b40;border-radius:12px;padding:14px;margin:12px 0}
h2{color:#53b5ff;font-size:19px}
button,input,select{border:0;border-radius:8px;padding:13px;font-size:16px}
button{background:#0879d1;color:white;font-weight:bold;margin:4px}
input,select{background:#263449;color:white;width:100%;margin:6px 0}
canvas{width:100%;background:#f4f6fa;border-radius:8px;touch-action:none}
#plano{height:300px}
#vista3d{height:260px}
.fila{display:flex;gap:6px}
.fila button{flex:1}
.item{background:#293b52;padding:10px;margin:6px 0;border-radius:8px}
</style>
</head>
<body>
<header>TODO EN TABLAROCA</header>
<main>
<div class="panel">
<h2>1. Nuevo diseño</h2>
<input id="proyecto" placeholder="Nombre del proyecto">
<select id="tipo">
<option>Muro</option><option>División</option>
<option>Plafón</option><option>Forrado</option>
<option>Diseño especial</option>
</select>
</div>

<div class="panel">
<h2>2. Trazar paredes</h2>
<label>Longitud del siguiente lado (metros)</label>
<input id="medida" type="number" min="0.01" step="0.01" placeholder="Ej. 3.50">
<label>Dirección</label>
<select id="direccion">
<option value="0">Derecha</option>
<option value="90">Abajo</option>
<option value="180">Izquierda</option>
<option value="270">Arriba</option>
</select>
<div class="fila">
<button onclick="agregarLado()">Agregar lado</button>
<button onclick="cerrarPlano()">Cerrar espacio</button>
</div>
<button onclick="deshacer()">Deshacer último lado</button>
<button onclick="nuevoPlano()">Nuevo diseño</button>
<div id="lista"></div>
</div>

<div class="panel">
<h2>3. Plano 2D</h2>
<canvas id="plano" width="700" height="500"></canvas>
</div>

<div class="panel">
<h2>4. Vista 3D preliminar</h2>
<label>Altura de paredes (metros)</label>
<input id="altura" type="number" value="2.40" step="0.01">
<canvas id="vista3d" width="700" height="400"></canvas>
</div>

<div class="panel">
<h2>5. Resumen del espacio</h2>
<div id="resumen">Agrega los lados del espacio.</div>
</div>
</main>

<script>
let lados=[];
let puntos=[{x:0,y:0}];
let cerrado=false;

function agregarLado(){
 if(cerrado){alert("Inicia un nuevo diseño.");return}
 let m=Number(document.getElementById("medida").value);
 let ang=Number(document.getElementById("direccion").value);
 if(!Number.isFinite(m)||m<=0){alert("Introduce una medida válida.");return}
 let rad=ang*Math.PI/180;
 let anterior=puntos[puntos.length-1];
 let nuevo={
  x:anterior.x+m*Math.cos(rad),
  y:anterior.y-m*Math.sin(rad)
 };
 lados.push({m,ang});
 puntos.push(nuevo);
 document.getElementById("medida").value="";
 actualizar();
}

 function cerrarPlano(){
 const primero = puntos[0];
 const ultimo = puntos[puntos.length-1];

 if(lados.length < 3){
  document.getElementById("resumen").textContent =
   "Necesitas al menos 3 lados.";
  return;
 }

 const distancia = Math.hypot(
  primero.x-ultimo.x,
  primero.y-ultimo.y
 );

 if(distancia > 0.05){
  document.getElementById("resumen").textContent =
   "Falta cerrar "+distancia.toFixed(2)+" metros.";
  return;
 }

 puntos[puntos.length-1] = {...primero};
 cerrado = true;

 actualizar();

 document.getElementById("resumen").textContent =
  "¡ESPACIO CERRADO CORRECTAMENTE!";
}

function deshacer(){
 if(!lados.length)return;
 lados.pop();
 puntos.pop();
 cerrado=false;
 actualizar();
}

function nuevoPlano(){
 lados=[];
 puntos=[{x:0,y:0}];
 cerrado=false;
 actualizar();
}

function actualizar(){
 let lista=document.getElementById("lista");
 lista.innerHTML="";
 lados.forEach((l,i)=>{
  let d=document.createElement("div");
  d.className="item";
  d.textContent="Lado "+(i+1)+": "+l.m.toFixed(2)+" m";
  lista.appendChild(d);
 });
 dibujar();
 resumen();
 dibujar3D();
}

function dibujar(){
 let c=document.getElementById("plano");
 let ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);
 if(puntos.length<2)return;

 let minX=Math.min(...puntos.map(p=>p.x));
 let maxX=Math.max(...puntos.map(p=>p.x));
 let minY=Math.min(...puntos.map(p=>p.y));
 let maxY=Math.max(...puntos.map(p=>p.y));

 let escala=Math.min(
  550/Math.max(maxX-minX,0.1),
  350/Math.max(maxY-minY,0.1)
 );
 let px=p=>75+(p.x-minX)*escala;
 let py=p=>75+(p.y-minY)*escala;

 ctx.strokeStyle="#0879d1";
 ctx.lineWidth=5;
 ctx.beginPath();
 puntos.forEach((p,i)=>{
  if(i===0)ctx.moveTo(px(p),py(p));
  else ctx.lineTo(px(p),py(p));
 });
 if(cerrado)ctx.closePath();
 ctx.stroke();

 puntos.forEach((p,i)=>{
  ctx.fillStyle="#e33434";
  ctx.beginPath();
  ctx.arc(px(p),py(p),6,0,Math.PI*2);
  ctx.fill();

  if(i<lados.length){
   let q=puntos[i+1];
   ctx.fillStyle="#15263c";
   ctx.font="18px Arial";
   ctx.fillText(lados[i].m.toFixed(2)+" m",
    (px(p)+px(q))/2,(py(p)+py(q))/2-12);
  }
 });
}

function resumen(){
 let total=lados.reduce((s,l)=>s+l.m,0);
 document.getElementById("resumen").textContent=
 "Proyecto: "+(document.getElementById("proyecto").value||"Sin nombre")+
 "\nLados: "+lados.length+
 "\nPerímetro: "+total.toFixed(2)+" m"+
 "\nEstado: "+(cerrado?"Espacio cerrado":"Trazado abierto")+
 "\nAltura: "+document.getElementById("altura").value+" m";
}

function dibujar3D(){
 let c=document.getElementById("vista3d");
 let ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);

 let h=Number(document.getElementById("altura").value);
 if(!Number.isFinite(h)||h<=0)return;

 let minX=Math.min(...puntos.map(p=>p.x));
 let minY=Math.min(...puntos.map(p=>p.y));
 let maxX=Math.max(...puntos.map(p=>p.x));
 let maxY=Math.max(...puntos.map(p=>p.y));
 let escala=Math.min(400/Math.max(maxX-minX,1),200/Math.max(maxY-minY,1),80);
 let alto=h*escala;
 let ox=100,oy=310;

 ctx.strokeStyle="#243b53";
 ctx.lineWidth=3;

 for(let i=0;i<lados.length;i++){
  let a=puntos[i],b=puntos[i+1];
  let ax=ox+(a.x-minX)*escala;
  let ay=oy+(a.y-minY)*escala;
  let bx=ox+(b.x-minX)*escala;
  let by=oy+(b.y-minY)*escala;

  ctx.fillStyle="#91b6d8";
  ctx.beginPath();
  ctx.moveTo(ax,ay-alto);
  ctx.lineTo(bx,by-alto);
  ctx.lineTo(bx,by);
  ctx.lineTo(ax,ay);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
 }
 ctx.fillStyle="#0879d1";
 ctx.font="18px Arial";
 ctx.fillText("Representación preliminar 3D",20,30);
}

document.getElementById("altura").addEventListener("input",()=>{
 dibujar3D();resumen();
});
actualizar();
</script>
</body>
</html>
