<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">
<title>Todo En Tablaroca</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{background:#0879d1;padding:18px;text-align:center;font-size:23px;font-weight:bold}
main{padding:12px}
.panel{background:#1d2b40;border-radius:12px;padding:14px;margin:12px 0}
h2{color:#53b5ff;font-size:19px}
button,input,select{border:0;border-radius:8px;padding:13px;font-size:16px}
button{background:#0879d1;color:white;font-weight:bold;margin:4px}
input,select{background:#263449;color:white;width:100%;margin:6px 0}
canvas{width:100%;background:#f4f6fa;border-radius:8px;touch-action:none}
#plano{height:300px}
#vista3d{height:260px}
.fila{display:flex;gap:6px}
.fila button{flex:1}
.item{background:#293b52;padding:10px;margin:6px 0;border-radius:8px}
</style>
</head>
<body>
<header>TODO EN TABLAROCA</header>
<main>
<div class="panel">
<h2>1. Nuevo diseño</h2>
<input id="proyecto" placeholder="Nombre del proyecto">
<select id="tipo">
<option>Muro</option><option>División</option>
<option>Plafón</option><option>Forrado</option>
<option>Diseño especial</option>
</select>
</div>

<div class="panel">
<h2>2. Trazar paredes</h2>
<label>Longitud del siguiente lado (metros)</label>
<input id="medida" type="number" min="0.01" step="0.01" placeholder="Ej. 3.50">
<label>Dirección (grados)</label>
<input id="direccion" type="number" value="0" min="0" max="359" step="1">
<div class="fila">
<button onclick="agregarLado()">Agregar lado</button>
<button onclick="cerrarPlano()">Cerrar espacio</button>
</div>
<button onclick="deshacer()">Deshacer último lado</button>
<button onclick="nuevoPlano()">Nuevo diseño</button>
<div id="lista"></div>
</div>

<div class="panel">
<h2>3. Plano 2D</h2>
<canvas id="plano" width="700" height="500"></canvas>
</div>

<div class="panel">
 <h2>Puertas</h2>

<label>Pared donde irá la puerta (número de lado)</label>
<input id="puertaPared" type="number" min="1" value="1">

<label>Ancho de puerta (metros)</label>
<input id="puertaAncho" type="number" value="0.90" step="0.01">

<label>Alto de puerta (metros)</label>
<input id="puertaAlto" type="number" value="2.10" step="0.01">

<label>Distancia desde el inicio de la pared (metros)</label>
<input id="puertaPosicion" type="number" value="0.50" step="0.01">

<button onclick="agregarPuerta()">Agregar puerta</button>
<div id="listaPuertas"></div>
 <h2>Ventanas</h2>

<label>Pared donde irá la ventana (número de lado)</label>
<input id="ventanaPared" type="number" min="1" value="1">

<label>Ancho de ventana (metros)</label>
<input id="ventanaAncho" type="number" value="1.20" step="0.01">

<label>Alto de ventana (metros)</label>
<input id="ventanaAlto" type="number" value="1.00" step="0.01">

<label>Distancia desde el inicio de la pared (metros)</label>
<input id="ventanaPosicion" type="number" value="0.50" step="0.01">

<label>Altura desde el piso (metros)</label>
<input id="ventanaAltura" type="number" value="0.90" step="0.01">

<button onclick="agregarVentana()">Agregar ventana</button>
<div id="listaVentanas"></div>
<h2>4. Vista 3D preliminar</h2>
<label>Altura de paredes (metros)</label>
<input id="altura" type="number" value="2.40" step="0.01">
<canvas id="vista3d" width="700" height="400"></canvas>
</div>

<div class="panel">
<h2>5. Resumen del espacio</h2>
<div id="resumen">Agrega los lados del espacio.</div>
</div>
</main>

<script>
let lados=[];
let puntos=[{x:0,y:0}];
let cerrado=false;
let puertas=[];
let ventanas=[];

function agregarLado(){
 if(cerrado){alert("Inicia un nuevo diseño.");return}
 let m=Number(document.getElementById("medida").value);
 let ang=Number(document.getElementById("direccion").value);
if(!Number.isFinite(ang)||ang<0||ang>359){
 alert("Introduce un ángulo entre 0 y 359 grados.");
 return;
}
 if(!Number.isFinite(m)||m<=0){alert("Introduce una medida válida.");return}
 let rad=ang*Math.PI/180;
 let anterior=puntos[puntos.length-1];
 let nuevo={
  x:anterior.x+m*Math.cos(rad),
  y:anterior.y-m*Math.sin(rad)
 };
 lados.push({m,ang});
 puntos.push(nuevo);
 document.getElementById("medida").value="";
 actualizar();
}
 function actualizarListaVentanas(){
 let lista=document.getElementById("listaVentanas");
 lista.innerHTML="";

 ventanas.forEach((v,i)=>{
  let item=document.createElement("div");
  item.className="item";

  let texto=document.createElement("span");
  texto.textContent="Ventana en pared "+(v.pared+1)+
   " | Ancho: "+v.ancho+" m | Alto: "+v.alto+
   " m | Posición: "+v.posicion+" m | Altura: "+v.altura+" m ";

  let boton=document.createElement("button");
  boton.textContent="Eliminar";
  boton.onclick=function(){
   ventanas.splice(i,1);
   actualizarListaVentanas();
   dibujar3D();
  };

  item.appendChild(texto);
  item.appendChild(boton);
  lista.appendChild(item);
 });
 }
function agregarVentana(){
 let pared=Number(document.getElementById("ventanaPared").value)-1;
 let ancho=Number(document.getElementById("ventanaAncho").value);
 let alto=Number(document.getElementById("ventanaAlto").value);
 let posicion=Number(document.getElementById("ventanaPosicion").value);
 let altura=Number(document.getElementById("ventanaAltura").value);

 if(!Number.isInteger(pared)||pared<0||pared>=lados.length){
  alert("Selecciona una pared válida.");
  return;
 }

 if(ancho<=0||alto<=0||posicion<0||altura<0){
  alert("Revisa las medidas de la ventana.");
  return;
 }

 if(posicion+ancho>lados[pared].m||altura+alto>Number(document.getElementById("altura").value)){
  alert("La ventana no cabe en esa pared.");
  return;
 }

 ventanas.push({pared,ancho,alto,posicion,altura});

 let lista=document.getElementById("listaVentanas");
lista.innerHTML="";

ventanas.forEach((v,i)=>{
 let item=document.createElement("div");
 item.className="item";

 let texto=document.createElement("span");
 texto.textContent="Ventana en pared "+(v.pared+1)+
  " | Ancho: "+v.ancho+" m | Alto: "+v.alto+
  " m | Posición: "+v.posicion+" m | Altura: "+v.altura+" m ";

 let boton=document.createElement("button");
 boton.textContent="Eliminar";
 boton.onclick=function(){
  ventanas.splice(i,1);
  actualizarListaVentanas();
  dibujar3D();
 };

 item.appendChild(texto);
 item.appendChild(boton);
 lista.appendChild(item);
});
 dibujar3D();
}
 function actualizarListaPuertas(){
 let lista=document.getElementById("listaPuertas");
 lista.innerHTML="";

 puertas.forEach((p,i)=>{
  let item=document.createElement("div");
  item.className="item";

  let texto=document.createElement("span");
  texto.textContent="Puerta en pared "+(p.pared+1)+
   " | Ancho: "+p.ancho+" m | Alto: "+p.alto+
   " m | Posición: "+p.posicion+" m ";

  let boton=document.createElement("button");
  boton.textContent="Eliminar";
  boton.onclick=function(){
   puertas.splice(i,1);
   actualizarListaPuertas();
   dibujar3D();
  };

  item.appendChild(texto);
  item.appendChild(boton);
  lista.appendChild(item);
 });
 }
 function agregarPuerta(){
 let pared=Number(document.getElementById("puertaPared").value)-1;
 let ancho=Number(document.getElementById("puertaAncho").value);
 let alto=Number(document.getElementById("puertaAlto").value);
 let posicion=Number(document.getElementById("puertaPosicion").value);

 if(!Number.isInteger(pared)||pared<0||pared>=lados.length){
  alert("Selecciona una pared válida.");
  return;
 }

 if(ancho<=0||alto<=0||posicion<0){
  alert("Revisa las medidas de la puerta.");
  return;
 }

 if(posicion+ancho>lados[pared].m){
  alert("La puerta no cabe en esa pared.");
  return;
 }

 puertas.push({pared,ancho,alto,posicion});

let lista=document.getElementById("listaPuertas");
lista.innerHTML="";

puertas.forEach((p,i)=>{
 let item=document.createElement("div");
 item.className="item";

 let texto=document.createElement("span");
 texto.textContent="Puerta en pared "+(p.pared+1)+
  " | Ancho: "+p.ancho+" m | Alto: "+p.alto+
  " m | Posición: "+p.posicion+" m ";

 let boton=document.createElement("button");
 boton.textContent="Eliminar";
 boton.onclick=function(){
  puertas.splice(i,1);
  actualizarListaPuertas();
  dibujar3D();
 };

 item.appendChild(texto);
 item.appendChild(boton);
 lista.appendChild(item);
});
 dibujar3D();
 alert("Puerta agregada correctamente.");
 }
 function cerrarPlano(){
 const primero = puntos[0];
 const ultimo = puntos[puntos.length-1];

 if(lados.length < 3){
  document.getElementById("resumen").textContent =
   "Necesitas al menos 3 lados.";
  return;
 }

 const distancia = Math.hypot(
  primero.x-ultimo.x,
  primero.y-ultimo.y
 );

 if(distancia > 0.05){
  document.getElementById("resumen").textContent =
   "Falta cerrar "+distancia.toFixed(2)+" metros.";
  return;
 }

 puntos[puntos.length-1] = {...primero};
 cerrado = true;

 actualizar();

 document.getElementById("resumen").textContent =
  "¡ESPACIO CERRADO CORRECTAMENTE!";
}

function deshacer(){
 if(!lados.length)return;
 lados.pop();
 puntos.pop();
 cerrado=false;
 actualizar();
}

function nuevoPlano(){
 lados=[];
 puntos=[{x:0,y:0}];
 puertas=[];
 ventanas=[];
document.getElementById("listaVentanas").innerHTML="";
 cerrado=false;

 document.getElementById("listaPuertas").innerHTML="";

 actualizar();
}

function actualizar(){
 let lista=document.getElementById("lista");
 lista.innerHTML="";
 lados.forEach((l,i)=>{
  let d=document.createElement("div");
  d.className="item";
  d.textContent="Lado "+(i+1)+": "+l.m.toFixed(2)+" m";
  lista.appendChild(d);
 });
 dibujar();
 resumen();
 dibujar3D();
}

function dibujar(){
 let c=document.getElementById("plano");
 let ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);
 if(puntos.length<2)return;

 let minX=Math.min(...puntos.map(p=>p.x));
 let maxX=Math.max(...puntos.map(p=>p.x));
 let minY=Math.min(...puntos.map(p=>p.y));
 let maxY=Math.max(...puntos.map(p=>p.y));

 let escala=Math.min(
  550/Math.max(maxX-minX,0.1),
  350/Math.max(maxY-minY,0.1)
 );
 let px=p=>75+(p.x-minX)*escala;
 let py=p=>75+(p.y-minY)*escala;

 ctx.strokeStyle="#0879d1";
 ctx.lineWidth=5;
 ctx.beginPath();
 puntos.forEach((p,i)=>{
  if(i===0)ctx.moveTo(px(p),py(p));
  else ctx.lineTo(px(p),py(p));
 });
 if(cerrado)ctx.closePath();
 ctx.stroke();

 puntos.forEach((p,i)=>{
  ctx.fillStyle="#e33434";
  ctx.beginPath();
  ctx.arc(px(p),py(p),6,0,Math.PI*2);
  ctx.fill();

  if(i<lados.length){
   let q=puntos[i+1];
   ctx.fillStyle="#15263c";
   ctx.font="18px Arial";
   ctx.fillText(lados[i].m.toFixed(2)+" m",
    (px(p)+px(q))/2,(py(p)+py(q))/2-12);
  }
 });
}

function resumen(){
 let total=lados.reduce((s,l)=>s+l.m,0);
 document.getElementById("resumen").textContent=
 "Proyecto: "+(document.getElementById("proyecto").value||"Sin nombre")+
 "\nLados: "+lados.length+
 "\nPerímetro: "+total.toFixed(2)+" m"+
 "\nEstado: "+(cerrado?"Espacio cerrado":"Trazado abierto")+
 "\nAltura: "+document.getElementById("altura").value+" m";
}

function dibujar3D(){
 let c=document.getElementById("vista3d");
 let ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);

 let h=Number(document.getElementById("altura").value);
 if(!Number.isFinite(h)||h<=0||puntos.length<2)return;

 let proyectados=puntos.map(p=>({
  x:p.x-p.y,
  y:(p.x+p.y)*0.5
 }));

 let minX=Math.min(...proyectados.map(p=>p.x));
 let maxX=Math.max(...proyectados.map(p=>p.x));
 let minY=Math.min(...proyectados.map(p=>p.y));
 let maxY=Math.max(...proyectados.map(p=>p.y));

 let escala=Math.min(
  500/Math.max(maxX-minX,1),
  140/Math.max(maxY-minY,1),
  170/h
 );

 let centroX=(minX+maxX)/2;
 let centroY=(minY+maxY)/2;

 let piso=proyectados.map(p=>({
  x:350+(p.x-centroX)*escala,
  y:260+(p.y-centroY)*escala
 }));

 let altura=h*escala;

 if(cerrado){
  ctx.beginPath();
  piso.forEach((p,i)=>{
   if(i===0)ctx.moveTo(p.x,p.y);
   else ctx.lineTo(p.x,p.y);
  });
  ctx.closePath();
  ctx.fillStyle="#dce8f2";
  ctx.fill();
 }

 for(let i=0;i<lados.length;i++){
  let a=piso[i];
  let b=piso[i+1];
  let color=i%2===0?"#91b6d8":"#7199bd";

  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.lineTo(b.x,b.y);
  ctx.lineTo(b.x,b.y-altura);
  ctx.lineTo(a.x,a.y-altura);
  ctx.closePath();

  ctx.fillStyle=color;
  ctx.fill();
  ctx.strokeStyle="#243b53";
  ctx.lineWidth=3;
  ctx.stroke();
    puertas.filter(p=>p.pared===i).forEach(p=>{
   let t0=p.posicion/lados[i].m;
   let t1=(p.posicion+p.ancho)/lados[i].m;

   let x0=a.x+(b.x-a.x)*t0;
   let y0=a.y+(b.y-a.y)*t0;

   let x1=a.x+(b.x-a.x)*t1;
   let y1=a.y+(b.y-a.y)*t1;

   let alturaPuerta=Math.min(p.alto,altura/escala)*escala;

   ctx.beginPath();
   ctx.moveTo(x0,y0);
   ctx.lineTo(x1,y1);
   ctx.lineTo(x1,y1-alturaPuerta);
   ctx.lineTo(x0,y0-alturaPuerta);
   ctx.closePath();

   ctx.fillStyle="#263449";
   ctx.fill();
   ctx.strokeStyle="#ffffff";
   ctx.lineWidth=2;
   ctx.stroke();
  });
  ventanas.filter(v=>v.pared===i).forEach(v=>{
 let t0=v.posicion/lados[i].m;
 let t1=(v.posicion+v.ancho)/lados[i].m;

 let x0=a.x+(b.x-a.x)*t0;
 let y0=a.y+(b.y-a.y)*t0;

 let x1=a.x+(b.x-a.x)*t1;
 let y1=a.y+(b.y-a.y)*t1;

 let alturaVentana=v.altura*escala;
 let altoVentana=v.alto*escala;

 ctx.beginPath();
 ctx.moveTo(x0,y0-alturaVentana);
 ctx.lineTo(x1,y1-alturaVentana);
 ctx.lineTo(x1,y1-alturaVentana-altoVentana);
 ctx.lineTo(x0,y0-alturaVentana-altoVentana);
 ctx.closePath();

 ctx.fillStyle="#70c7e8";
 ctx.fill();
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=2;
 ctx.stroke();
});
 }

 ctx.fillStyle="#0879d1";
 ctx.font="18px Arial";
 ctx.fillText("Vista 3D isométrica preliminar",20,30);
}
 

document.getElementById("altura").addEventListener("input",()=>{
 dibujar3D();resumen();
});
actualizar();
</script>
</body>
</html>
